# Generic metadata about this project
name: flows
prefect-version: 3.1.11

# build section allows you to manage and build docker images
build:
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.4.0
      image_name: "{{ prefect.variables.life_image_name }}"
      tag: latest
      dockerfile: ./Dockerfile
      platform: linux/amd64

# push section allows you to manage if and how this project is uploaded to remote locations
push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.4.0
      image_name: "{{ prefect.variables.life_image_name }}"
      tag: "{{ build-image.tag }}"

# pull section allows you to provide instructions for cloning this project in remote locations
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect

# the definitions section allows you to define reusable components for your deployments
definitions:
  tags: &common_tags
    - life
  work_pool: &common_work_pool
    name: kubernetes
    job_variables:
      image: "{{ prefect.variables.life_image_name }}"
      env:
        PREFECT_LOGGING_EXTRA_LOGGERS: "fitbit_exporter,google_health_exporter,asken_exporter,aw_exporter,geocode_places"

# the deployments section allows you to provide configuration for deploying flows
deployments:
  - name: life_bronze_asken
    tags: *common_tags
    entrypoint: asken_exporter/asken_flow.py:asken_flow
    work_pool: *common_work_pool
    schedules:
      # 30分ごと（個人スクレイピング、食事ログの鮮度は30分で十分）
      - cron: "0,30 * * * *"
        timezone: "Asia/Tokyo"
    parameters: {}
    enforce_parameter_schema: true

  - name: life_bronze_fitbit
    tags: *common_tags
    entrypoint: fitbit_exporter/fitbit_flow.py:fitbit_flow
    work_pool: *common_work_pool
    schedules:
      # 15分ごと（Fitbit APIレート150req/h以内、睡眠データ鮮度改善）
      - cron: "*/15 * * * *"
        timezone: "Asia/Tokyo"
    parameters: {}
    enforce_parameter_schema: true

  # Fitbit の後継。レガシー Fitbit Web API は 2026年9月に停止する（月内の
  # 正確な日付は Google 未公表）。体重・体脂肪は 2026-08-31 を最後に
  # 既に配信が止まっていた。停止日が読めないので life_bronze_fitbit と
  # しばらく並行稼働させ、切れる瞬間に穴を空けない。
  - name: life_bronze_google_health
    tags: *common_tags
    entrypoint: google_health_exporter/google_health_flow.py:google_health_flow
    work_pool: *common_work_pool
    schedules:
      # 15分ごと（fitbit と同じ鮮度。直近2日だけを浅く引く）
      - cron: "*/15 * * * *"
        timezone: "Asia/Tokyo"
    parameters:
      lookback_days: 2
    enforce_parameter_schema: true

  # 遡って引き直す専用の枠。
  # fitbit_flow は対象日が「昨日と今日」だけで、後から入った値やその時だけ
  # 失敗した日が永久に欠けたままになる（実例: 2026-08-23 の体重は今 API を
  # 叩けば取れるのに bronze は null）。silver の14日自己修復は bronze が
  # 更新されない限り効かないため、bronze 自体を毎日引き直す枠を分ける。
  # 15分ごとの浅い取得と分けているのは、毎回14日分を引くのが無駄なだけで
  # 意味がないから。
  - name: life_bronze_google_health_backfill
    tags: *common_tags
    entrypoint: google_health_exporter/google_health_flow.py:google_health_flow
    work_pool: *common_work_pool
    schedules:
      # 1日1回、朝の静かな時間に14日分
      - cron: "10 4 * * *"
        timezone: "Asia/Tokyo"
    parameters:
      lookback_days: 14
    enforce_parameter_schema: true

  - name: life_bronze_aw
    tags: *common_tags
    entrypoint: aw_exporter/aw_flow.py:aw_flow
    work_pool: *common_work_pool
    schedules:
      # 15分ごと（ローカルサーバー、負荷なし）
      - cron: "*/15 * * * *"
        timezone: "Asia/Tokyo"
    parameters: {}
    enforce_parameter_schema: true

  - name: life_bronze_aw_reconcile
    tags: *common_tags
    entrypoint: aw_exporter/aw_reconcile_flow.py:aw_reconcile_flow
    work_pool: *common_work_pool
    schedules:
      # 日次 03:40。aw_flow は「昨日+今日」しか取らないため、クラスタ障害や
      # スマホの遅延同期で空いた穴が永久に埋まらない。AW サーバは全履歴を持って
      # いるので、日次で突き合わせて埋め直す。
      # 04:00 前に置くのは、朝の AI FB が読む時点で gold が揃っているようにするため
      # （dbt は10分ごと・reprocess_days=14 なので埋め直せば自動で伝播する）。
      - cron: "40 3 * * *"
        timezone: "Asia/Tokyo"
    parameters:
      lookback_days: 30
      dry_run: false
    enforce_parameter_schema: false

  - name: life_data_pipeline
    tags: *common_tags
    entrypoint: dbt_lifeos/main_data_flow.py:main_data_flow
    work_pool: *common_work_pool
    concurrency_limit:
      limit: 1
      # slot が埋まっていれば新規 run は即 Cancelled。
      # AwaitingConcurrencySlot で溜まらない。
      collision_strategy: CANCEL_NEW
    schedules:
      # 10分ごと。reprocess_days=14 なのでスキップされても次の run で吸収される。
      - cron: "*/10 * * * *"
        timezone: "Asia/Tokyo"
    parameters: {}
    enforce_parameter_schema: true

  # ─── AI フィードバック ──────────────────────────────────────
  # 旧構成（朝8時 / 昼13時 / 夜22時 の3回）は廃止した。
  # 実測で3枠が同じネタを再放送していた（直近30日70件のうち81%が「深夜」に言及、
  # 49%が「概日リズム」）。生活習慣は日次では変化しないので、1日に3回
  # 「新しい洞察」を要求すると必ず同じ話の言い換えになる。
  #
  # 新構成:
  #   life_ai_feedback_gate  … 05:00-11:00 に15分ごと。起床を検知したら1回だけ発火。
  #                            11時までに検知できなければ徹夜/未装着として強制発火。
  #   （日次本体は gate から呼ばれるので deployment を持たない）
  - name: life_ai_feedback_gate
    tags: *common_tags
    entrypoint: ai_feedback/daily_flow.py:ai_feedback_wake_gate_flow
    work_pool: *common_work_pool
    schedules:
      # 05:00〜11:00 の15分ごと。生成済みなら即終了するので空振りは軽い。
      # Fitbit の同期は端末次第で遅れるため、時刻固定ではなくポーリングにしている。
      - cron: "*/15 5-11 * * *"
        timezone: "Asia/Tokyo"
    parameters:
      force_hour: 11
    enforce_parameter_schema: false

  # 週次。処方（今週の実験）を出すのはここだけ。
  # SQL探索権限と検索を持ち、介入日での前後比較をして issue を1つ立てる。
  - name: life_ai_feedback_weekly
    tags: *common_tags
    entrypoint: ai_feedback/weekly_flow.py:ai_feedback_weekly_flow
    work_pool: *common_work_pool
    schedules:
      # 月曜 07:30。日次 gate（05:00-11:00）と重なるが、日次は起床検知で1回だけ
      # 走るので競合しない。週次の対象期間は前日（日曜）まで。
      - cron: "30 7 * * 1"
        timezone: "Asia/Tokyo"
    parameters: {}
    enforce_parameter_schema: false

  # 手動リラン用（起床検知を待たずに生成したいとき）。スケジュールなし。
  - name: life_ai_feedback_daily_manual
    tags: *common_tags
    entrypoint: ai_feedback/daily_flow.py:ai_feedback_daily_flow
    work_pool: *common_work_pool
    parameters:
      force: true
    enforce_parameter_schema: false

  - name: life_geocode_places
    tags: *common_tags
    entrypoint: timeline_exporter/geocode_flow.py:geocode_flow
    work_pool: *common_work_pool
    schedules:
      # 6時間ごと（Places API 呼び出しは未キャッシュ分のみ）
      - cron: "30 */6 * * *"
        timezone: "Asia/Tokyo"
    parameters: {}
    enforce_parameter_schema: true


  - name: life_iceberg_compaction
    tags: *common_tags
    entrypoint: common/compaction_flow.py:iceberg_compaction_flow
    work_pool: *common_work_pool
    schedules:
      # 月〜土 03:00 JST: optimize のみ（軽量・約10分、MinIO負荷なし）。
      # expire_snapshots / remove_orphan_files は MinIO-on-NFS では初回catch-upが
      # 激重（12h事件）なので日次から除外し、週次 deep に集約。
      - cron: "0 3 * * 1-6"
        timezone: "Asia/Tokyo"
    parameters: {}
    enforce_parameter_schema: true

  - name: life_iceberg_compaction_deep
    tags: *common_tags
    entrypoint: common/compaction_flow.py:iceberg_compaction_flow
    work_pool: *common_work_pool
    schedules:
      # 日曜 03:00 JST のみ: optimize + expire + remove_orphan_files（重い reclaim を
      # オフピークの週1に集約）。3時間の timeout ガードあり。
      - cron: "0 3 * * 0"
        timezone: "Asia/Tokyo"
    parameters:
      reclaim: true
    enforce_parameter_schema: true

  - name: life_hive_lock_janitor
    tags: *common_tags
    entrypoint: common/hive_lock_janitor.py:hive_lock_janitor
    work_pool: *common_work_pool
    schedules:
      # 5分ごと。kill/timeout した dbt run が残す孤立 Hive ロックを、
      # 手動対応を待たず 1 インターバル以内に除去する（HIVE_TABLE_LOCK_NOT_ACQUIRED 対策）。
      - cron: "*/5 * * * *"
        timezone: "Asia/Tokyo"
    parameters: {}
    enforce_parameter_schema: true
